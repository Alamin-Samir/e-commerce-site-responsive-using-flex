<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>

  <title>Responsive Example</title>
</head>
<body class="bg-gray-50">

  <!-- Header Text -->
  <p class="text-center bg-emerald-900 text-white text-sm sm:text-base md:text-lg py-2.5">
    Lorem ipsum eveniet exercitationem possimus. Qui vitae sint recusandae et!
  </p>

  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-3 my-4 px-3">

    <!-- Logo + Text -->
    <div class="flex items-center gap-3">
      <img class="h-10 w-10" src="https://icon2.cleanpng.com/lnd/20240426/fco/aa8k4horf.webp" alt="">
      <div>
        <p class="text-2xl sm:text-3xl font-semibold text-emerald-700">TOP SHELF</p>
        <p class="text-emerald-900 text-sm sm:text-base">Bangladesh is nice</p>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="flex items-center w-full sm:w-auto bg-white border border-emerald-700 rounded-full overflow-hidden">
      <input type="text" placeholder="Search" class="flex-1 px-3 py-1 border-0 outline-none focus:ring-0 text-sm sm:text-base">
      <button class="px-3 text-xl text-emerald-800">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

  </div>

</body>
</html>
